&lt;header&gt;&lt;h1&gt;🌲 GPS Florestal&lt;/h1&gt;&lt;p&gt;Mapa de campo • GPS • PDF • pontos salvos&lt;/p&gt;&lt;/header&gt;&lt;main&gt;
&lt;section class=&quot;card&quot;&gt;&lt;div class=&quot;status&quot;&gt;&lt;span id=&quot;gpsDot&quot; class=&quot;dot&quot;&gt;&lt;/span&gt;&lt;span id=&quot;gpsStatus&quot;&gt;GPS aguardando ativação&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;coords&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Latitude&lt;/span&gt;&lt;strong id=&quot;lat&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Longitude&lt;/span&gt;&lt;strong id=&quot;lon&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Precisão estimada&lt;/span&gt;&lt;strong id=&quot;accuracy&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Última atualização&lt;/span&gt;&lt;strong id=&quot;updated&quot;&gt;—&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;startGps&quot;&gt;Ativar GPS&lt;/button&gt;&lt;button class=&quot;secondary&quot; id=&quot;stopGps&quot;&gt;Parar GPS&lt;/button&gt;&lt;button class=&quot;secondary&quot; id=&quot;centerGps&quot;&gt;Centralizar em mim&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Permita a localização no navegador e mantenha o GPS do aparelho ligado. A primeira carga dos mapas precisa de internet.&lt;/p&gt;&lt;/section&gt;

&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Sobrepor mapa PDF&lt;/h2&gt;&lt;label&gt;Selecionar PDF/GeoPDF&lt;input id=&quot;mapFile&quot; type=&quot;file&quot; accept=&quot;.pdf,.geopdf,application/pdf&quot;&gt;&lt;/label&gt;&lt;p id=&quot;pdfName&quot; class=&quot;small&quot;&gt;Nenhum PDF selecionado.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;O aplicativo tenta ler automaticamente as coordenadas geográficas embutidas no GeoPDF. Quando encontradas, os limites são preenchidos e o mapa é enquadrado automaticamente. PDFs sem georreferenciamento exigem configuração por uma referência conhecida.&lt;/p&gt;&lt;details id=&quot;manualLimits&quot;&gt;&lt;summary&gt;Configuração manual (somente se necessária)&lt;/summary&gt;&lt;div class=&quot;grid4&quot;&gt;&lt;label&gt;Latitude sul&lt;input id=&quot;south&quot; type=&quot;number&quot; step=&quot;any&quot; placeholder=&quot;Ex.: -22.50&quot;&gt;&lt;/label&gt;&lt;label&gt;Longitude oeste&lt;input id=&quot;west&quot; type=&quot;number&quot; step=&quot;any&quot; placeholder=&quot;Ex.: -49.10&quot;&gt;&lt;/label&gt;&lt;label&gt;Latitude norte&lt;input id=&quot;north&quot; type=&quot;number&quot; step=&quot;any&quot; placeholder=&quot;Ex.: -22.45&quot;&gt;&lt;/label&gt;&lt;label&gt;Longitude leste&lt;input id=&quot;east&quot; type=&quot;number&quot; step=&quot;any&quot; placeholder=&quot;Ex.: -49.00&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;overlayPdf&quot;&gt;Aplicar / enquadrar PDF&lt;/button&gt;&lt;button id=&quot;removePdf&quot; class=&quot;secondary&quot;&gt;Remover sobreposição&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;overlayStatus&quot; class=&quot;small&quot;&gt;O PDF é processado no aparelho; não é enviado para a internet.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Registrar ponto de campo&lt;/h2&gt;&lt;label&gt;Nome do ponto&lt;input id=&quot;pointName&quot; placeholder=&quot;Ex.: Entrada do talhão 12&quot;&gt;&lt;/label&gt;&lt;label&gt;Tipo&lt;select id=&quot;pointType&quot;&gt;&lt;option&gt;Talhão&lt;/option&gt;&lt;option&gt;Estrada&lt;/option&gt;&lt;option&gt;Acesso&lt;/option&gt;&lt;option&gt;Obstáculo&lt;/option&gt;&lt;option&gt;Máquina&lt;/option&gt;&lt;option&gt;Ocorrência&lt;/option&gt;&lt;option&gt;Outro&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Observações&lt;textarea id=&quot;pointNotes&quot; rows=&quot;2&quot; placeholder=&quot;Detalhes do local (opcional)&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;savePoint&quot;&gt;Salvar ponto com GPS&lt;/button&gt;&lt;button id=&quot;saveManual&quot; class=&quot;secondary&quot;&gt;Salvar coordenadas atuais&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Os pontos continuam no armazenamento local deste navegador/aparelho. Não limpe os dados do navegador sem exportar um backup.&lt;/p&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Pontos salvos &lt;span id=&quot;pointCount&quot; class=&quot;small&quot;&gt;(0)&lt;/span&gt;&lt;/h2&gt;&lt;div id=&quot;pointsList&quot;&gt;&lt;p class=&quot;muted&quot;&gt;Nenhum ponto registrado ainda.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;exportData&quot;&gt;Exportar backup JSON&lt;/button&gt;&lt;label class=&quot;filebtn secondary&quot;&gt;Restaurar backup&lt;input id=&quot;importData&quot; type=&quot;file&quot; accept=&quot;.json,application/json&quot; class=&quot;hidden&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;Uso offline — importante&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;A interface, os pontos e o PDF escolhido podem funcionar sem internet depois de carregados. Os mapas de ruas e satélite são fornecidos por serviços externos; o cache guarda apenas blocos que já foram carregados e não garante que toda a fazenda esteja disponível offline. Para offline confiável, será necessário instalar um pacote de mapas da área de trabalho com licença compatível. Não apague os dados do site, pois isso pode apagar os pontos salvos.&lt;/p&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;GPS Florestal • versão de campo em desenvolvimento&lt;/footer&gt;

const $=id=&gt;document.getElementById(id);let watchId=null,currentPosition=null,pdfObjectUrl=null,pdfOverlay=null,pdfCanvas=null;const STORAGE_KEY=&#x27;gps-florestal-points-v1&#x27;;

function toggleMapFullscreen(){const card=$(&#x27;mapCard&#x27;),btn=$(&#x27;fullMapBtn&#x27;);const entering=!card.classList.contains(&#x27;fullscreen&#x27;);card.classList.toggle(&#x27;fullscreen&#x27;,entering);document.body.classList.toggle(&#x27;map-fullscreen&#x27;,entering);btn.textContent=entering?&#x27;✕ Voltar&#x27;:&#x27;⛶ Tela inteira&#x27;;if(entering&amp;&amp;card.requestFullscreen){card.requestFullscreen().catch(()=&gt;{});}else if(!entering&amp;&amp;document.fullscreenElement&amp;&amp;document.exitFullscreen){document.exitFullscreen().catch(()=&gt;{});}setTimeout(()=&gt;{if(map)map.invalidateSize({animate:false});},250)}$(&#x27;fullMapBtn&#x27;).addEventListener(&#x27;click&#x27;,toggleMapFullscreen);document.addEventListener(&#x27;fullscreenchange&#x27;,()=&gt;{if(!document.fullscreenElement&amp;&amp;$(&#x27;mapCard&#x27;).classList.contains(&#x27;fullscreen&#x27;)){$(&#x27;mapCard&#x27;).classList.remove(&#x27;fullscreen&#x27;);document.body.classList.remove(&#x27;map-fullscreen&#x27;);$(&#x27;fullMapBtn&#x27;).textContent=&#x27;⛶ Tela inteira&#x27;;setTimeout(()=&gt;{if(map)map.invalidateSize({animate:false});},200)}});
function initMap(){if(!window.L){$(&#x27;mapStatus&#x27;).textContent=&#x27;Biblioteca do mapa não carregou. Abra o aplicativo conectado à internet uma vez e recarregue.&#x27;;return}map=L.map(&#x27;map&#x27;,{zoomControl:true}).setView([-22.3,-49.0],10);streetLayer=L.tileLayer(&#x27;https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png&#x27;,{maxZoom:19,attribution:&#x27;© OpenStreetMap contributors&#x27;,crossOrigin:true});satLayer=L.tileLayer(&#x27;https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}&#x27;,{maxZoom:19,attribution:&#x27;Tiles © Esri&#x27;,crossOrigin:true});streetLayer.addTo(map);pointLayer=L.layerGroup().addTo(map);$(&#x27;streetBtn&#x27;).onclick=()=&gt;setBase(&#x27;street&#x27;);$(&#x27;satBtn&#x27;).onclick=()=&gt;setBase(&#x27;sat&#x27;);setTimeout(()=&gt;map.invalidateSize(),250);renderMapPoints()}
function setBase(which){if(!map)return;activeLayer=which;if(map.hasLayer(streetLayer))map.removeLayer(streetLayer);if(map.hasLayer(satLayer))map.removeLayer(satLayer);(which===&#x27;street&#x27;?streetLayer:satLayer).addTo(map);$(&#x27;streetBtn&#x27;).classList.toggle(&#x27;active&#x27;,which===&#x27;street&#x27;);$(&#x27;satBtn&#x27;).classList.toggle(&#x27;active&#x27;,which===&#x27;sat&#x27;);$(&#x27;mapStatus&#x27;).textContent=(which===&#x27;street&#x27;?&#x27;Camada de ruas/estradas&#x27;:&#x27;Camada de satélite&#x27;)+&#x27;. Blocos carregados podem estar em cache; cobertura offline não é garantida.&#x27;}

function gpsError(err){$(&#x27;gpsStatus&#x27;).textContent=({1:&#x27;Permissão de localização negada&#x27;,2:&#x27;Posição indisponível&#x27;,3:&#x27;Tempo esgotado&#x27;})[err.code]||&#x27;Não foi possível obter GPS&#x27;;$(&#x27;gpsDot&#x27;).classList.remove(&#x27;ok&#x27;)}
